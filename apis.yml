aid: tabtabtab
name: TabTabTab
description: >-
  TabTabTab runs coding agents in the background, triggered by webhooks,
  schedules, Slack, or direct requests. You wire up a trigger once and work
  comes back to you: code changes arrive as pull requests you can verify before
  you merge, while ops and data-analysis jobs skip the PR and report back when
  done. Agents run on a persistent cloud VM ("environment") on your own Codex or
  Claude Code accounts, coordinated by an always-on meta agent that routes work
  across projects and dispatches isolated worker sessions. Every pull request
  ships with receipts — a browser test video, a password-protected preview URL,
  and a trace of what triggered the run — so verification is a two-minute review
  instead of a re-investigation. Drive it from the dashboard, from Slack, or with
  the official tabtabtab CLI and the published tabtabtab agent skill.
